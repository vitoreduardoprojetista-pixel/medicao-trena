<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Medição de Esquadrias</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #9333ea 100%);
    --bg: #eef1fa; --card: #ffffff; --ink: #1e2233; --muted: #6b7280; --line: #e7e9f2;
    --shadow: 0 2px 10px rgba(49,46,129,.07); --shadow-lg: 0 10px 30px rgba(49,46,129,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
  header { background: var(--grad); color: #fff; padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 26px; box-shadow: var(--shadow-lg); }
  header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .2px; }
  header p { margin: 6px 0 0; font-size: 14px; opacity: .85; }
  main { flex: 1; padding: 22px 16px 32px; max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .opcao { display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; background: var(--card); border-radius: 20px; padding: 22px 18px; box-shadow: var(--shadow-lg); border: 2px solid transparent; transition: transform .08s; }
  .opcao:active { transform: scale(.98); }
  .opcao .ico { flex: none; width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; }
  .opcao.bt .ico { background: var(--grad); }
  .opcao.cam .ico { background: linear-gradient(135deg, #0ea5e9, #0d9488); }
  .opcao .tit { font-size: 19px; font-weight: 800; line-height: 1.2; }
  .opcao .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .opcao .seta { margin-left: auto; font-size: 26px; color: #c4c8d6; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: #b45309; background: #fef3c7; border-radius: 999px; padding: 2px 8px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Medição de Esquadrias</h1>
  <p>Escolha como você vai medir</p>
</header>
<main>
  <a class="opcao bt" href="medicao.html">
    <div class="ico">📶</div>
    <div>
      <div class="tit">Trena digital com Bluetooth</div>
      <div class="sub">A medida cai direto no caderno de medição</div>
    </div>
    <div class="seta">›</div>
  </a>
  <a class="opcao cam" href="camera.html">
    <div class="ico">📷</div>
    <div>
      <div class="tit">Trena digital sem Bluetooth</div>
      <div class="sub">Medição pela foto do visor da trena</div>
      <span class="tag">Em desenvolvimento</span>
    </div>
    <div class="seta">›</div>
  </a>
</main>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
